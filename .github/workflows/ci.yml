name: CI

# Every reference solution must pass all its tests and every broken/
# solution must fail at least one hidden case (npm run verify), on the
# same JDK version the browser runs (25). Also types, lint and the build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Bundle content
        run: npm run content

      # next typegen writes the route types (LayoutProps and friends) that
      # tsc needs; locally they come from an earlier dev or build.
      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify questions
        run: npm run verify

      - name: Build
        run: npm run build
