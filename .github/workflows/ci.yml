name: CI

# Every reference solution must pass all its tests and every broken/
# solution must fail at least one hidden case (npm run verify), on the
# same JDK version the browser runs (25). Also types, lint and the build,
# and the browser tests: Java compiling and running in Chromium through
# CheerpJ, grading that agrees with verify, the exam workspace, and
# accounts (signed in with a test login, on an in-memory Postgres).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Bundle content
        run: npm run content

      # next typegen writes the route types (LayoutProps and friends) that
      # tsc needs; locally they come from an earlier dev or build.
      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify questions
        run: npm run verify

      # Accounts: one student can never read or change another's data.
      - name: Account data tests
        run: npm run test:accounts

      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # The grading tests compare the browser with a local JDK 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Starts the test database and dev server itself (playwright.config.ts).
      - name: Browser tests
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
